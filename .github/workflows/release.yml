name: Release source package
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Verify tag and package tracked source only
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          git archive --format=zip --prefix="$REPO_NAME/" HEAD -o source.zip
          sha256sum source.zip > source.zip.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" source.zip source.zip.sha256 --verify-tag --notes-file docs/release-notes.md --title "$RELEASE_TAG"
